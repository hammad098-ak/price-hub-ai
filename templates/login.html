<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Price Hub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #060913;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: none;
        }
        .cursor {
            width: 20px; height: 20px; border: 2px solid #38ef7d; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            transition: transform 0.1s ease, background 0.3s;
            mix-blend-mode: difference; background: rgba(56,239,125,0.1);
            transform: translate(-50%, -50%);
        }
        .cursor.hover { transform: translate(-50%, -50%) scale(2); background: #38ef7d; }
        canvas#particleCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.1; z-index: 1; pointer-events: none; }
        .orb-1 { width: 400px; height: 400px; background: #38ef7d; top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #11998e; bottom: -50px; left: -50px; }
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 50px 45px;
            border: 1px solid rgba(56, 239, 125, 0.2);
            box-shadow: 0 0 60px rgba(56,239,125,0.1), 0 30px 60px rgba(0,0,0,0.8);
            width: 420px;
            text-align: center;
            z-index: 10;
            position: relative;
            transition: transform 0.3s ease;
        }
        .login-card:hover { transform: translateY(-8px); }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 34px; font-weight: 700;
            background: linear-gradient(135deg, #38ef7d, #11998e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 35px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; display: block; }
        input {
            width: 100%; padding: 14px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
            color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #38ef7d; box-shadow: 0 0 0 3px rgba(56,239,125,0.2); }
        .btn-primary {
            width: 100%; background: linear-gradient(135deg, #38ef7d, #11998e);
            color: #060913; border: none; padding: 15px; border-radius: 10px;
            font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 20px;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #2ecc71, #0d8a72); box-shadow: 0 15px 30px rgba(56,239,125,0.4); }
        .footer-text { margin-top: 30px; color: #64748b; font-size: 13px; }
        a { color: #38ef7d; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="cursor" id="customCursor"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="orb orb-1"></div><div class="orb orb-2"></div>
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your command center</p>
        <form method="POST">
            <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Enter your username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
            <button type="submit" class="btn-primary">Sign In →</button>
        </form>
        <p class="footer-text">New to Price Hub? <a href="/register">Create an account</a></p>
    </div>
    <script>
        // Custom cursor
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX+'px'; cursor.style.top = e.clientY+'px'; });
        document.querySelectorAll('a,button,input').forEach(el=>{
            el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
            el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
        });
        // Particle network
        const canvas=document.getElementById('particleCanvas'),ctx=canvas.getContext('2d');
        let w,h,particles=[],max=80,connDist=120;
        function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
        window.addEventListener('resize',resize);resize();
        class Particle{
            constructor(){this.reset();}
            reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-0.5)*0.6;this.vy=(Math.random()-0.5)*0.6;this.r=Math.random()*2+1;this.op=Math.random()*0.5+0.3;}
            update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1;}
            draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(56,239,125,${this.op})`;ctx.fill();}
        }
        for(let i=0;i<max;i++)particles.push(new Particle());
        function anim(){
            ctx.clearRect(0,0,w,h);
            particles.forEach(p=>{p.update();p.draw();});
            for(let i=0;i<particles.length;i++){
                for(let j=i+1;j<particles.length;j++){
                    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<connDist){
                        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
                        ctx.strokeStyle=`rgba(56,239,125,${0.15*(1-dist/connDist)})`;ctx.lineWidth=0.5;ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
